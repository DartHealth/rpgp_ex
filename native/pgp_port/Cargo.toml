[package]
name = "pgp_port"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The native OpenPGP process behind the rpgp_ex Elixir package"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DartHealth/rpgp_ex"
publish = false

[dependencies]
pgp = "0.21"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
